name: tests

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    name: POSIX runtime suite (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
          - name: macOS arm64
            runner: macos-14
          - name: macOS x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      # This is the source-build recipe used by Jolt's core workflow. Do not
      # substitute a distro Chez package: Jolt's build paths need the source
      # installation's kernel development files as well as `scheme` itself.
      - name: Install source-build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git liblz4-dev zlib1g-dev \
            libncurses-dev uuid-dev libssl-dev

      - name: Install source-build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install lz4 openssl@3

      - name: Cache Chez Scheme (Linux)
        if: runner.os == 'Linux'
        id: cache-chez-linux
        uses: actions/cache@v4
        with:
          path: ~/chez
          key: chez-${{ runner.os }}-${{ runner.arch }}-v10.4.1-x11off-v1

      - name: Build official Chez Scheme v10.4.1 from source (Linux)
        if: runner.os == 'Linux' && steps.cache-chez-linux.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v10.4.1 \
            https://github.com/cisco/ChezScheme.git "$RUNNER_TEMP/chez-src"
          cd "$RUNNER_TEMP/chez-src"
          ./configure --installprefix="$HOME/chez" --threads --disable-x11
          make -j"$(nproc)"
          make install

      - name: Cache Chez Scheme (macOS)
        if: runner.os == 'macOS'
        id: cache-chez-macos
        uses: actions/cache@v4
        with:
          path: ~/chez
          key: chez-${{ runner.os }}-${{ runner.arch }}-v10.4.1-x11off-v1

      - name: Build official Chez Scheme v10.4.1 from source (macOS)
        if: runner.os == 'macOS' && steps.cache-chez-macos.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v10.4.1 \
            https://github.com/cisco/ChezScheme.git "$RUNNER_TEMP/chez-src"
          cd "$RUNNER_TEMP/chez-src"
          ./configure --installprefix="$HOME/chez" --threads --disable-x11
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Provide and assert official Chez v10.4.1
        shell: bash
        run: |
          set -euo pipefail
          bindir="$HOME/chez/bin"
          test -x "$bindir/scheme"
          printf '#!/bin/sh\nexec %s "$@"\n' "$bindir/scheme" > "$bindir/chez"
          chmod +x "$bindir/chez"
          echo "$bindir" >> "$GITHUB_PATH"
          "$bindir/chez" --version | tee /tmp/chez-version
          grep -Fq '10.4.1' /tmp/chez-version

      # Run the exact minimum released source claimed by deps.edn. The source
      # checkout keeps Intel macOS covered even though no release binary is
      # published for that runner architecture.
      - name: Checkout official Jolt v0.8.1
        uses: actions/checkout@v4
        with:
          repository: jolt-lang/jolt
          ref: v0.8.1
          submodules: recursive
          path: jolt

      # Build the exact libhegel version required by the pinned binding from
      # tagged source so Intel macOS still runs the complete property suite.
      - name: Checkout pinned libhegel source (macOS x86_64)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        uses: actions/checkout@v4
        with:
          repository: hegeldev/hegel-rust
          ref: 94edce76aaac1e96e3d93916475d9b2fa3ee97f0
          persist-credentials: false
          path: hegel-rust

      - name: Build pinned libhegel 0.33.3 (macOS x86_64)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        working-directory: hegel-rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.86.0 --profile minimal
          cargo +1.86.0 build --locked -p hegeltest-c --release
          library="$PWD/target/release/libhegel_c.dylib"
          test -f "$library"
          echo "HEGEL_LIBHEGEL_LIBRARY=$library" >> "$GITHUB_ENV"

      - name: Install libhegel
        shell: bash
        run: |
          JOLT_PWD="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/jolt/bin/jolt" \
            -A:test -m hegel.install

      - name: Run tests
        shell: bash
        env:
          JOLT_HEGEL_REQUIRED: "1"
        run: |
          JOLT_PWD="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/jolt/bin/jolt" -M:test

# The pinned jolt.net has reviewed Windows W1/W2 blocking and non-blocking byte
# I/O, but no readiness backend. Keep native layers anyway: source-build Chez,
# first exercise dependency-free TCP models and production namespace loading,
# then install libhegel and run descriptor-independent buffer properties.
# Requiring open-poller to fail closed keeps these claims distinct from real
# client/server loopback coverage.
  windows-portable:
    name: portable TCP gate (Windows x86_64; no socket runtime)
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/aot-cache
      JOLT_GITLIBS_DIR: ${{ github.workspace }}/.jolt/gitlibs
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 source-build toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            git make mingw-w64-x86_64-gcc mingw-w64-x86_64-lz4
            mingw-w64-x86_64-zlib

      - name: Cache Chez Scheme
        id: cache-chez-windows
        uses: actions/cache@v4
        with:
          path: chez-install
          key: chez-${{ runner.os }}-${{ runner.arch }}-v10.4.1-mingw64-v1

      - name: Build official Chez Scheme v10.4.1 from source
        if: steps.cache-chez-windows.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v10.4.1 \
            https://github.com/cisco/ChezScheme.git "$RUNNER_TEMP/chez-src"
          cd "$RUNNER_TEMP/chez-src"
          ./configure --threads
          make -j"$(nproc)"
          inst="$GITHUB_WORKSPACE/chez-install"
          mkdir -p "$inst/bin" "$inst/csv"
          cp ta6nt/bin/ta6nt/*.exe "$inst/bin/"
          cp ta6nt/bin/ta6nt/*.dll "$inst/bin/" 2>/dev/null || true
          cp ta6nt/boot/ta6nt/petite.boot ta6nt/boot/ta6nt/scheme.boot "$inst/bin/"
          cp ta6nt/boot/ta6nt/petite.boot ta6nt/boot/ta6nt/scheme.boot "$inst/csv/"
          cp ta6nt/boot/ta6nt/scheme.h "$inst/csv/"
          cp ta6nt/boot/ta6nt/libkernel.a "$inst/csv/"

      - name: Provide and assert official Chez v10.4.1
        run: |
          set -euo pipefail
          bindir="$GITHUB_WORKSPACE/chez-install/bin"
          test -x "$bindir/scheme.exe"
          { echo '#!/bin/sh'; echo "exec \"$bindir/scheme.exe\" \"\$@\""; } > "$bindir/chez"
          { echo '#!/bin/sh'; echo 'exec gcc "$@"'; } > "$bindir/cc"
          chmod +x "$bindir/chez" "$bindir/cc"
          echo "$bindir" >> "$GITHUB_PATH"
          echo "JOLT_CHEZ_CSV=$GITHUB_WORKSPACE/chez-install/csv" >> "$GITHUB_ENV"
          "$bindir/chez" --version | tee "$RUNNER_TEMP/chez-version"
          grep -Fq '10.4.1' "$RUNNER_TEMP/chez-version"

      # POSIX lanes above retain released Jolt v0.8.1. Windows temporarily
      # exercises the reviewed path fix proposed in jolt-lang/jolt#710.
      - name: Checkout reviewed Jolt Windows path candidate
        uses: actions/checkout@v4
        with:
          repository: casselc/jolt
          ref: f7f5dd31251e0b04dc4f8f377a7779f89b932379
          submodules: recursive
          path: jolt

      - name: Run dependency-free portable TCP contracts
        shell: powershell
        env:
          JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/native-cache
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-source.ps1" `
            -JoltTcpPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:GITHUB_WORKSPACE\chez-install\bin\scheme.exe" `
            -TestAlias '-M:windows-portable-test' `
            -TimeoutSeconds 180

      - name: Install libhegel and run portable buffer properties
        shell: powershell
        env:
          JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/native-cache
          JOLT_HEGEL_REQUIRED: "1"
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-source.ps1" `
            -JoltTcpPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:GITHUB_WORKSPACE\chez-install\bin\scheme.exe" `
            -TestAlias '-M:windows-buffer-property-test' `
            -InstallHegel `
            -TimeoutSeconds 180

# Windows ARM64 has no reviewed jolt.net descriptor yet, so loading
# teensyp.client/server would correctly fail before any socket call. This
# public-preview lane still proves that native source-mode Jolt and libhegel can
# exercise the descriptor-independent production buffer layer. It then checks
# the dependency's unsupported target boundary explicitly. No packaged runtime,
# devboot, AOT cache, emulated x64 Chez, or socket-runtime claim is involved.
  windows-arm64-source-preview:
    name: source-mode buffer preview (Windows aarch64; non-AOT, no sockets)
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 40
    continue-on-error: true
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/native-cache
      JOLT_GITLIBS_DIR: ${{ github.workspace }}/.jolt/gitlibs
    steps:
      - name: Checkout jolt-tcp
        uses: actions/checkout@v4

      - name: Checkout official Chez Scheme v10.4.1
        uses: actions/checkout@v4
        with:
          repository: cisco/ChezScheme
          ref: v10.4.1
          submodules: recursive
          persist-credentials: false
          path: chez-arm64

      - name: Build native ARM64 Chez Scheme from source
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\chez-arm64"
          call build.bat tarm64nt /only

      # POSIX lanes retain released Jolt v0.8.1. Windows temporarily exercises
      # the reviewed path fix proposed in jolt-lang/jolt#710.
      - name: Checkout reviewed Jolt Windows path candidate
        uses: actions/checkout@v4
        with:
          repository: casselc/jolt
          ref: f7f5dd31251e0b04dc4f8f377a7779f89b932379
          submodules: recursive
          path: jolt

      - name: Assert native Chez for source-mode Jolt
        shell: pwsh
        run: |
          $scheme = Join-Path $env:GITHUB_WORKSPACE `
            'chez-arm64\tarm64nt\bin\tarm64nt\scheme.exe'
          if (-not (Test-Path $scheme)) {
            throw "native ARM64 Chez executable not found: $scheme"
          }
          $version = (& $scheme --version | Out-String)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host $version
          if (-not $version.Contains('10.4.1')) {
            throw "expected Chez Scheme 10.4.1, got: $version"
          }

      - name: Resolve Git dependencies and run portable buffer properties
        shell: pwsh
        env:
          JOLT_HEGEL_REQUIRED: "1"
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-source.ps1" `
            -JoltTcpPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:GITHUB_WORKSPACE\chez-arm64\tarm64nt\bin\tarm64nt\scheme.exe" `
            -TestAlias '-M:windows-arm64-preview' `
            -InstallHegel `
            -TimeoutSeconds 180
