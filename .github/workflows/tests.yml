name: tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  # One reviewed fork revision for every source-mode lane. Keep this centralized
  # so a platform cannot silently validate against a different core.
  JOLT_CORE_SHA: b921991e532ce2555d947bf88bc0464bf0c89d27
  CHEZ_TOOLCHAIN_RELEASE: chez-ci-10.4.1.1

jobs:
  test:
    name: POSIX runtime suite (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            chez-target: linux-x86_64
            chez-sha256: 16476cd98fb5cb2e2c0285e88fcd6d57ade9392ca8d7cf603ca38432b4118526
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            chez-target: linux-aarch64
            chez-sha256: b5b2306d3d6468b5fc7d5836721b09c704c7750f887a6232f1aeeb567d55f5d9
          - name: macOS arm64
            runner: macos-15
            chez-target: macos-arm64
            chez-sha256: d5b5a504eed1e0f117b4a3dd23ad0030bb3e5c0da6d6b9d9f990f5f2fa32478f
          - name: macOS x86_64
            runner: macos-15-intel
            chez-target: macos-x86_64
            chez-sha256: e4577ad71b1f1e1062c361fa612af60d75378e64dc2869d8c8eefd3d7efdbc62
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The immutable archives carry Chez and its source-runtime headers. Keep
      # only the libraries exercised by this repository plus the extractor;
      # Chez itself is never built from source in this workflow.
      - name: Install runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y liblz4-dev libssl-dev zlib1g-dev zstd

      - name: Install runtime dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install lz4 openssl@3 zstd

      - name: Set up the shared Chez CI toolchain
        id: chez
        uses: casselc/jolt-toolchains/setup-chez@095108ae32659757808064d004855092567d3ad3
        with:
          target: ${{ matrix.chez-target }}
          release-tag: ${{ env.CHEZ_TOOLCHAIN_RELEASE }}
          sha256: ${{ matrix.chez-sha256 }}
          capabilities: source-runtime

      # The action checks the caller-pinned digest, packaged inventory, Chez
      # version, and target machine type. There is no source-build fallback.
      - name: Provide and assert official Chez v10.4.1
        shell: bash
        run: |
          set -euo pipefail
          test -x "$JOLT_CHEZ"
          "$JOLT_CHEZ" --version > "$RUNNER_TEMP/chez-version" 2>&1
          cat "$RUNNER_TEMP/chez-version"
          grep -Fq '10.4.1' "$RUNNER_TEMP/chez-version"

      # This is the reviewed core containing the host/FFI primitives required
      # by the exact jolt-net dependency in deps.edn.
      - name: Checkout pinned Jolt core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: casselc/jolt
          ref: ${{ env.JOLT_CORE_SHA }}
          submodules: recursive
          persist-credentials: false
          path: jolt

      # libhegel 0.30.1 has no Darwin/x86_64 release asset. Build the exact
      # tagged source so Intel macOS still runs the complete property suite.
      - name: Checkout pinned libhegel source (macOS x86_64)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: hegeldev/hegel-rust
          ref: f81c6cceabe3c6695a249588c751a5ce93dffa00
          persist-credentials: false
          path: hegel-rust

      - name: Build pinned libhegel 0.30.1 (macOS x86_64)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        working-directory: hegel-rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.86.0 --profile minimal
          cargo +1.86.0 build --locked -p hegeltest-c --release
          library="$PWD/target/release/libhegel_c.dylib"
          test -f "$library"
          echo "HEGEL_LIBHEGEL_LIBRARY=$library" >> "$GITHUB_ENV"

      - name: Install libhegel
        shell: bash
        run: |
          JOLT_PWD="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/jolt/bin/jolt" \
            -A:test -m hegel.install

      - name: Run tests
        shell: bash
        env:
          JOLT_HEGEL_REQUIRED: "1"
        run: |
          JOLT_PWD="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/jolt/bin/jolt" -M:test

# The pinned jolt.net has reviewed Windows readiness backends, so both native
# Windows architectures exercise REAL loopback sockets, not portable models.
#
# Three layers, deliberately ordered so coverage cannot silently vanish:
#   1. a dependency-free runtime gate -- real accept/read/write, half-close,
#      refused connects, deadlines, and stop/close waking a blocked readiness
#      wait -- with no jolt-hegel and no installed artifact in the graph;
#   2. the complete -M:test suite with JOLT_HEGEL_REQUIRED=1;
#   3. the descriptor-independent buffer properties.
# Layer 1 stays even though layer 2 subsumes it: if the optional test
# dependency ever fails to resolve or install, Windows socket coverage must
# still fail loudly rather than quietly disappear.
  windows-runtime:
    name: TCP runtime suite (Windows x86_64; real loopback)
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/aot-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the shared Chez CI toolchain
        id: chez
        uses: casselc/jolt-toolchains/setup-chez@095108ae32659757808064d004855092567d3ad3
        with:
          target: windows-x86_64
          release-tag: ${{ env.CHEZ_TOOLCHAIN_RELEASE }}
          sha256: 360c60496eea2f8aab0e557eb77e9e18b315bb9181938158ae57655aa541b7f8
          capabilities: source-runtime

      - name: Provide and assert official Chez v10.4.1
        shell: powershell
        env:
          CHEZ_EXECUTABLE: ${{ steps.chez.outputs.executable }}
        run: |
          $version = (& $env:CHEZ_EXECUTABLE --version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host $version
          if (-not $version.Contains('10.4.1')) {
            throw "expected Chez Scheme 10.4.1, got: $version"
          }

      - name: Checkout pinned Jolt core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: casselc/jolt
          ref: ${{ env.JOLT_CORE_SHA }}
          submodules: recursive
          persist-credentials: false
          path: jolt

      - name: Run dependency-free TCP runtime contracts (real loopback)
        shell: powershell
        env:
          JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/native-cache
          CHEZ_EXECUTABLE: ${{ steps.chez.outputs.executable }}
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-source.ps1" `
            -JoltTcpPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:CHEZ_EXECUTABLE" `
            -ExpectedArch 'x86-64' `
            -TestAlias '-M:windows-runtime-test' `
            -TimeoutSeconds 300

      - name: Install libhegel and run the complete test suite
        shell: powershell
        env:
          JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/native-cache
          JOLT_HEGEL_REQUIRED: "1"
          CHEZ_EXECUTABLE: ${{ steps.chez.outputs.executable }}
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-source.ps1" `
            -JoltTcpPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:CHEZ_EXECUTABLE" `
            -ExpectedArch 'x86-64' `
            -TestAlias '-M:test' `
            -InstallHegel `
            -TimeoutSeconds 900

      - name: Install libhegel and run portable buffer properties
        shell: powershell
        env:
          JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/native-cache
          JOLT_HEGEL_REQUIRED: "1"
          CHEZ_EXECUTABLE: ${{ steps.chez.outputs.executable }}
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-source.ps1" `
            -JoltTcpPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:CHEZ_EXECUTABLE" `
            -ExpectedArch 'x86-64' `
            -TestAlias '-M:windows-buffer-property-test' `
            -InstallHegel `
            -TimeoutSeconds 180

# Windows ARM64 runs the same three gates as x86-64. This is source-runtime
# evidence only: official native Chez 10.4.1, AOT disabled, no packaged joltc.
# The exact target check in windows-runtime-test makes an emulated x86-64 Jolt
# process fail before the positive poller assertion or any TCP test can pass.
  windows-arm64-runtime:
    name: TCP runtime suite (Windows aarch64; real loopback)
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 60
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/native-cache
    steps:
      - name: Checkout jolt-tcp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Assert the runner is ARM64
        shell: pwsh
        run: |
          Write-Host "runner.arch      = ${{ runner.arch }}"
          Write-Host "PROCESSOR_ARCH   = $env:PROCESSOR_ARCHITECTURE"
          Write-Host "OS architecture  = $((Get-CimInstance Win32_OperatingSystem).OSArchitecture)"
          if ('${{ runner.arch }}' -ne 'ARM64') {
            throw "expected an ARM64 runner, got '${{ runner.arch }}'"
          }

      - name: Set up the shared Chez CI toolchain
        id: chez
        uses: casselc/jolt-toolchains/setup-chez@095108ae32659757808064d004855092567d3ad3
        with:
          target: windows-arm64
          release-tag: ${{ env.CHEZ_TOOLCHAIN_RELEASE }}
          sha256: 9bc28462823a1447de6d849e129758a6317cc9deafb8e87414817e7244f149c8
          capabilities: source-runtime

      - name: Checkout pinned Jolt core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: casselc/jolt
          ref: ${{ env.JOLT_CORE_SHA }}
          submodules: recursive
          persist-credentials: false
          path: jolt

      - name: Assert native ARM64 Chez v10.4.1
        shell: pwsh
        env:
          CHEZ_EXECUTABLE: ${{ steps.chez.outputs.executable }}
        run: |
          $scheme = $env:CHEZ_EXECUTABLE
          if (-not (Test-Path $scheme)) {
            throw "native ARM64 Chez executable not found: $scheme"
          }
          $version = (& $scheme --version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "scheme.exe --version exited $LASTEXITCODE"
          }
          Write-Host "chez version: $version"
          if (-not $version.Contains('10.4.1')) {
            throw "expected Chez Scheme 10.4.1, got: $version"
          }
          $probe = Join-Path $env:RUNNER_TEMP 'machine-type.ss'
          Set-Content -Path $probe -Value '(display (machine-type))(newline)'
          $machine = (& $scheme --script $probe | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "scheme.exe --script exited $LASTEXITCODE"
          }
          Write-Host "chez machine-type: $machine"
          if ($machine -ne 'tarm64nt') {
            throw "expected Chez machine-type tarm64nt, got '$machine'"
          }
          echo "JOLT_TCP_CHEZ=$scheme" >> $env:GITHUB_ENV

      - name: Run dependency-free TCP runtime contracts (real loopback)
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-source.ps1" `
            -JoltTcpPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:JOLT_TCP_CHEZ" `
            -ExpectedArch 'aarch64' `
            -TestAlias '-M:windows-runtime-test' `
            -TimeoutSeconds 300

      - name: Install libhegel and run the complete test suite
        shell: pwsh
        env:
          JOLT_HEGEL_REQUIRED: "1"
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-source.ps1" `
            -JoltTcpPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:JOLT_TCP_CHEZ" `
            -ExpectedArch 'aarch64' `
            -TestAlias '-M:test' `
            -InstallHegel `
            -TimeoutSeconds 900

      - name: Install libhegel and run portable buffer properties
        shell: pwsh
        env:
          JOLT_HEGEL_REQUIRED: "1"
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-source.ps1" `
            -JoltTcpPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:JOLT_TCP_CHEZ" `
            -ExpectedArch 'aarch64' `
            -TestAlias '-M:windows-buffer-property-test' `
            -InstallHegel `
            -TimeoutSeconds 180
